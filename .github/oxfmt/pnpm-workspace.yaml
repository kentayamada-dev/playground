# .github/textlint/pnpm-workspace.yaml と同じ設定にする。それぞれの理由は、そちらのコメントにある
engineStrict: true
saveExact: true
minimumReleaseAge: 1440
minimumReleaseAgeIgnoreMissingTime: false
trustPolicy: no-downgrade
registries:
  https://npm.flatt.tech/:
    scopes: ["@", "@jsr"]
    prefix: npmjs
  https://gh.invalid/:
    prefix: gh
