name: setup-mise
description: CI のツールを、.github の mise.toml と mise.lock で固定した版で入れる
inputs:
  install_args:
    description: 入れるツール。mise.toml の [tools] のキーを空白で区切って並べる
    required: true
runs:
  using: composite
  steps:
    - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
      with:
        # sha256 を渡すと、署名付きの SHASUMS256.txt での mise 本体の照合を飛ばすため、version だけを渡す
        # https://github.com/jdx/mise-action/blob/v5.1.2/src/index.ts#L882-L903
        version: 2026.10.25
        working_directory: .github
        install_args: ${{ inputs.install_args }}
