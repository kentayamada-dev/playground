name: Dev Container のビルド

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# 同じ PR に push し直したら古い実行を取り消す。PR 以外は実行ごとにグループを分け、待っている実行も後から来た実行に取り消されないようにする
# https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  devcontainer:
    name: devcontainer
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 後のステップで git の認証を使わないため、資格情報をディスクに残さない https://docs.zizmor.sh/audits/#artipacked
          persist-credentials: false
      # Dockerfile の ARG の値は compose.yaml から渡すため、docker build ではなく Compose でビルドする
      - run: docker compose build
      # PR でほかのジョブが動かさないツールだけ、起動するかを確かめる。golang-check・node-check でツールを使わなくなったら、ここに足す
      - run: docker compose run --rm golang gopls version
      - run: docker compose run --rm golang govulncheck -version
      # tools にツールを足したとき、ここに並べ忘れても検査から漏れないよう、ディレクトリをすべて回る
      - run: docker compose run --rm --workdir /workspace/.devcontainer/golang/tools golang sh -c 'for dir in */; do echo "$dir"; (cd "$dir" && go mod tidy -diff) || exit 1; done'
