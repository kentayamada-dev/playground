name: node-check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# 同じ PR に push し直したら古い実行を取り消す。PR 以外は実行ごとにグループを分け、待っている実行も後から来た実行に取り消されないようにする
# https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  node-check:
    name: node-check
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 後のステップで git の認証を使わないため、資格情報をディスクに残さない https://docs.zizmor.sh/audits/#artipacked
          persist-credentials: false
      # Node.js と pnpm の版を node の Dockerfile だけで管理するため、Dev Container と同じイメージのなかで検査する。
      # Dockerfile の ARG の値は compose.yaml から渡すため、docker build ではなく Compose でビルドする
      - run: docker compose build node
      - run: docker compose run --rm node pnpm install --frozen-lockfile
      # コンテナの dev の uid はランナーの uid と一致するとは限らないため、どの uid でも .next などを作れるようにする
      # https://github.com/kentayamada-dev/playground/pull/335
      - run: chmod a+w node
      - run: docker compose run --rm node pnpm typecheck
      - run: docker compose run --rm node pnpm fmt:check
      - run: docker compose run --rm node pnpm lint
      - run: docker compose run --rm node pnpm knip
