name: typos

on:
  pull_request:
  push:
    branches:
      - main
      - test/typos-hidden-pass

permissions:
  contents: read

jobs:
  typos:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 後のステップで git の認証を使わないため、資格情報をディスクに残さない https://docs.zizmor.sh/audits/#artipacked
          persist-credentials: false
      - uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5.1.0
        with:
          # sha256 を渡すと、署名付きの SHASUMS256.txt での mise 本体の照合を飛ばすため、version だけを渡す
          # https://github.com/jdx/mise-action/blob/v5.0.0/src/index.ts#L724-L745
          version: 2026.10.1
          # ローカルでは使わないので、mise.toml と mise.lock はルートではなく .github に置いている
          working_directory: .github
          install_args: github:crate-ci/typos
      # 隠しファイルを読み、.git を除く設定は .github/typos.toml にある
      - run: typos --config .github/typos.toml
      # 検証用: ディレクトリを渡す方式と、変更前の一覧を渡す方式（[files] のない設定）で、読むファイルを比べる
      - run: |
          sed '/^\[files\]/,/^$/d' .github/typos.toml > "$RUNNER_TEMP/old-typos.toml"
          cat "$RUNNER_TEMP/old-typos.toml"
          typos --config .github/typos.toml --files | sed 's|^\./||' | sort > "$RUNNER_TEMP/dir.txt"
          git ls-files | typos --config "$RUNNER_TEMP/old-typos.toml" --file-list - --files | sed 's|^\./||' | sort > "$RUNNER_TEMP/list.txt"
          git ls-files | sort > "$RUNNER_TEMP/git.txt"
          wc -l "$RUNNER_TEMP/dir.txt" "$RUNNER_TEMP/list.txt" "$RUNNER_TEMP/git.txt"
          echo '--- git ls-files と、一覧を渡す方式の差'
          diff "$RUNNER_TEMP/git.txt" "$RUNNER_TEMP/list.txt" || true
          echo '--- 一覧を渡す方式と、ディレクトリを渡す方式の差'
          diff "$RUNNER_TEMP/list.txt" "$RUNNER_TEMP/dir.txt"
        shell: bash
