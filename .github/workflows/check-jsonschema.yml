name: 設定ファイルのスキーマ

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# 同じ PR に push し直したら古い実行を取り消す。PR 以外は実行ごとにグループを分け、待っている実行も後から来た実行に取り消されないようにする
# https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  check-jsonschema:
    name: check-jsonschema
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    env:
      check_jsonschema_dir: .github/check-jsonschema
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 後のステップで git の認証を使わないため、資格情報をディスクに残さない https://docs.zizmor.sh/audits/#artipacked
          persist-credentials: false
      - uses: $/.github/actions/setup-mise
        with:
          install_args: uv
      - run: uv sync --locked
        working-directory: ${{ env.check_jsonschema_dir }}
      # devcontainer.json はコメントを含むため、JSON5 として読ませる。
      # devContainer.schema.json は VS Code のスキーマをブランチの最新で参照し、版を固定できないため、ベースのスキーマで検査する
      # https://github.com/devcontainers/spec/blob/c95ffeed1d059abfe9ffbe79762dc2fa4e7c2421/schemas/devContainer.schema.json
      - run: >-
          "$check_jsonschema_dir/.venv/bin/check-jsonschema"
          --force-filetype json5
          --schemafile https://raw.githubusercontent.com/devcontainers/spec/c95ffeed1d059abfe9ffbe79762dc2fa4e7c2421/schemas/devContainer.base.schema.json
          .devcontainer/*/devcontainer.json
      # config.yml は issue フォームではないため除く。!(config) は config 以外の名前に一致する
      - run: |
          shopt -s extglob
          "$check_jsonschema_dir/.venv/bin/check-jsonschema" --builtin-schema vendor.github-issue-forms .github/ISSUE_TEMPLATE/!(config).yml
      - run: >-
          "$check_jsonschema_dir/.venv/bin/check-jsonschema" --builtin-schema vendor.github-issue-config .github/ISSUE_TEMPLATE/config.yml
      - run: >-
          "$check_jsonschema_dir/.venv/bin/check-jsonschema" --builtin-schema vendor.github-actions .github/actions/*/action.yml
