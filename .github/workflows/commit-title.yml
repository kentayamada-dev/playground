name: commit-title

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  commit-title:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          # sha256 を渡すと、署名付きの SHASUMS256.txt での mise 本体の照合を飛ばすため、version だけを渡す
          # https://github.com/jdx/mise-action/blob/v5.0.0/src/index.ts#L724-L745
          version: 2026.9.17
          install_args: gh
      # マージの画面や gh pr merge --subject で PR タイトルと違うタイトルにでき、コミットメッセージを制限するルールは Enterprise 向けで使えないため、マージ後に照合する
      # https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/incorporating-changes-from-a-pull-request/merging-a-pull-request https://docs.github.com/en/enterprise-cloud@latest/repositories/configuring-branches-and-merges-in-your-repository/managing-rulesets/available-rules-for-rulesets#metadata-restrictions
      - run: .github/scripts/check-commit-title.sh "$GITHUB_SHA"
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
