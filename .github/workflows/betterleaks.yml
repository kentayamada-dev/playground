name: betterleaks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  betterleaks:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # 履歴全体を走査するため
          fetch-depth: 0
      # 公式のアクションがなく、イメージは GHCR にしかなく公開時刻が取れないため、Renovate の minimumReleaseAge の待ちが明けない。
      # mise で入れ、mise.toml の版と mise.lock のハッシュは Renovate の mise マネージャーが更新する https://docs.renovatebot.com/key-concepts/minimum-release-age/
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          # sha256 を渡すと、署名付きの SHASUMS256.txt での mise 本体の照合を飛ばすため、version だけを渡す
          # https://github.com/jdx/mise-action/blob/v5.0.0/src/index.ts#L724-L745
          version: 2026.9.18
          # ローカルでは使わないので、mise.toml と mise.lock はルートではなく .github に置いている
          working_directory: .github
          install_args: betterleaks
      # 既定の git log は --all でほかのブランチも読み、別の PR の検出でこの PR まで落ちるため、HEAD からたどれる履歴に絞る（--all 以外は既定と同じ）
      # https://github.com/betterleaks/betterleaks/blob/v1.9.0/sources/git.go#L121-L122
      # 公開リポジトリの実行ログは GitHub にログインすれば誰でも読めるため、--redact で値を伏せる https://docs.github.com/en/actions/how-tos/monitor-workflows/use-workflow-run-logs
      # 見つけたときだけ終了コードを 2 にし、インストールや設定の誤りで落ちたとき（1）には無効化の手順を出さない
      # https://github.com/betterleaks/betterleaks/blob/v1.9.0/cmd/root.go#L640-L646
      - run: |
          betterleaks git --no-banner --redact --verbose --exit-code 2 \
            --log-opts="--full-history --diff-filter=tuxdb HEAD" . || status=$?
          if [ "${status:-0}" -eq 2 ]; then
            message='誤検知でなければ、シークレットは push した時点で公開済みです。コミットを消して通すだけで終わらせず、先に発行元で無効化してください'
            # README の見出し「シークレットが見つかったとき」を URL エンコードしたもの。注釈の自動リンクが日本語の手前で切れるため
            # https://github.com/kentayamada-dev/playground/actions/runs/38739495976
            readme="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/main/README.md#%E3%82%B7%E3%83%BC%E3%82%AF%E3%83%AC%E3%83%83%E3%83%88%E3%81%8C%E8%A6%8B%E3%81%A4%E3%81%8B%E3%81%A3%E3%81%9F%E3%81%A8%E3%81%8D"
            # ワークフローコマンドでは % がエスケープの記号になるため、%25 にする
            # https://github.com/actions/toolkit/blob/7e25f67e8fd17369aa21e6e816ac99654106e0dc/packages/core/src/command.ts#L103-L108
            echo "::error title=シークレットが見つかりました::$message。手順: ${readme//%/%25}"
            printf '## シークレットが見つかりました\n\n%s。\n\n手順は [README](%s) にあります。\n' "$message" "$readme" >>"$GITHUB_STEP_SUMMARY"
          fi
          exit "${status:-0}"
