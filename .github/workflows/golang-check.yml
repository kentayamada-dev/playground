name: golang-check

on:
  pull_request:
  push:
    branches:
      - main
      - test/golang-check-pass

permissions:
  contents: read

# 同じ PR に push し直したら古い実行を取り消す。PR 以外は実行ごとにグループを分け、待っている実行も後から来た実行に取り消されないようにする
# https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  golang-check:
    name: golang-check
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 後のステップで git の認証を使わないため、資格情報をディスクに残さない https://docs.zizmor.sh/audits/#artipacked
          persist-credentials: false
      # Go とツールの版を golang の Dockerfile と tools の go.mod だけで管理するため、Dev Container と同じイメージのなかで検査する。
      # Dockerfile の ARG の値は compose.yaml から渡すため、docker build ではなく Compose でビルドする
      - run: docker compose build golang
      - run: |
          id
          stat -c '%u:%g %n' . golang
          docker compose run --rm --workdir /workspace/golang golang sh -c '
            id
            stat -c "%u:%g %n" /workspace /workspace/golang
            git -C /workspace status --short; echo "git exit: $?"
            touch .write-test; echo "touch exit: $?"
            go vet ./...; echo "vet exit: $?"
            gofumpt -d .; echo "gofumpt exit: $?"
            staticcheck ./...; echo "staticcheck exit: $?"
            go test ./...; echo "test exit: $?"
            go build -buildvcs=false -o "$(mktemp -d)" ./...; echo "build exit: $?"
          '
      - run: docker compose run --rm --workdir /workspace/golang golang go build ./...
      - run: docker compose run --rm --workdir /workspace/golang golang go vet ./...
      # -l は整形との差分があっても終了コード 0 を返すため、差分で 1 を返す -d を使う
      # https://github.com/mvdan/gofumpt/blob/v0.12.0/gofmt.go
      - run: docker compose run --rm --workdir /workspace/golang golang gofumpt -d .
      - run: docker compose run --rm --workdir /workspace/golang golang staticcheck ./...
      - run: docker compose run --rm --workdir /workspace/golang golang go test ./...
