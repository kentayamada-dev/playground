name: golang-check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# 同じ PR に push し直したら古い実行を取り消す。PR 以外は実行ごとにグループを分け、待っている実行も後から来た実行に取り消されないようにする
# https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  golang-check:
    name: golang-check
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 後のステップで git の認証を使わないため、資格情報をディスクに残さない https://docs.zizmor.sh/audits/#artipacked
          persist-credentials: false
      # Go とツールの版を golang の Dockerfile と tools の go.mod だけで管理するため、Dev Container と同じイメージのなかで検査する。
      # Dockerfile の ARG の値は compose.yaml から渡すため、docker build ではなく Compose でビルドする
      - run: docker compose build golang
      # コンテナの dev とランナーの uid が違い、git がリポジトリの所有者の違いで止まって VCS の情報を埋め込めず、checkout にも書き込めないため、
      # 埋め込みを切り、実行ファイルを一時ディレクトリに書く https://pkg.go.dev/cmd/go@go1.27.3#hdr-Compile_packages_and_dependencies
      - run: docker compose run --rm golang sh -c 'go build -buildvcs=false -o "$(mktemp -d)" ./...'
      - run: docker compose run --rm golang gosec -tests ./...
      - run: docker compose run --rm golang go vet ./...
      # -l は整形との差分があっても終了コード 0 を返すため、差分で 1 を返す -d を使う
      # https://github.com/mvdan/gofumpt/blob/v0.12.0/gofmt.go
      - run: docker compose run --rm golang gofumpt -d .
      - run: docker compose run --rm golang staticcheck ./...
      # gosec はデフォルトではテストのファイルを検査しないため、-tests で含める
      # https://github.com/securego/gosec/blob/v2.30.0/cmd/gosec/main.go
      - run: docker compose run --rm golang go test ./...
