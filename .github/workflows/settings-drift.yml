name: settings-drift

on:
  # GitHub の画面で変えた設定や、定義を変えたあとに反映し忘れた設定は、PR の検査では見つからないため、定期的に検査する
  schedule:
    - cron: '23 22 * * *'
  workflow_dispatch:

# 書き込み権限はジョブごとに与え、あとから足したジョブに引き継がせない https://docs.zizmor.sh/audits/#excessive-permissions
permissions: {}

# 同じ PR に push し直したら古い実行を取り消す。PR 以外は実行ごとにグループを分け、待っている実行も後から来た実行に取り消されないようにする
# https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  settings-drift:
    name: settings-drift
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write # report-settings-drift.sh が、ずれを見つけたら issue を作るか書き換え、なくなったら閉じるため
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 後のステップで git の認証を使わないため、資格情報をディスクに残さない https://docs.zizmor.sh/audits/#artipacked
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          # sha256 を渡すと、署名付きの SHASUMS256.txt での mise 本体の照合を飛ばすため、version だけを渡す
          # https://github.com/jdx/mise-action/blob/v5.0.0/src/index.ts#L724-L745
          version: 2026.10.8
          working_directory: .github
          install_args: jq
      # gh のエラーは標準エラー出力に出るため、issue の本文にも残す
      - id: check
        run: .github/scripts/sync-github-settings/sync-github-settings.sh --check 2>&1 | tee "$RUNNER_TEMP/settings-drift.txt"
        # 未指定時の bash -e {0} は pipefail がなく、tee の前の失敗を見逃す https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#defaultsrunshell
        shell: bash
        env:
          # Actions の権限などを読むには Administration の read 権限が要るが、GITHUB_TOKEN には与えられないため、PAT を使う
          # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#permissions
          GH_TOKEN: ${{ secrets.SETTINGS_READ_TOKEN }}
      - if: failure() && steps.check.outcome == 'failure'
        run: .github/scripts/report-settings-drift/report-settings-drift.sh "$RUNNER_TEMP/settings-drift.txt"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
      - run: .github/scripts/report-settings-drift/report-settings-drift.sh --resolved
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
