name: actionlint

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 後のステップで git の認証を使わないため、資格情報をディスクに残さない https://docs.zizmor.sh/audits/#artipacked
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          # sha256 を渡すと、署名付きの SHASUMS256.txt での mise 本体の照合を飛ばすため、version だけを渡す
          # https://github.com/jdx/mise-action/blob/v5.0.0/src/index.ts#L724-L745
          version: 2026.10.3
          # ローカルでは使わないので、mise.toml と mise.lock はルートではなく .github に置いている
          working_directory: .github
          # actionlint は PATH に shellcheck があるときだけ、run: のスクリプトも shellcheck で検査する
          # https://github.com/rhysd/actionlint/blob/v1.7.12/docs/checks.md#check-shellcheck-integ
          install_args: actionlint shellcheck
      - run: actionlint
