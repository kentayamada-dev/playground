name: hadolint

on:
  pull_request:
  push:
    branches:
      - main
      - test/hadolint-find-pass

permissions:
  contents: read

jobs:
  hadolint:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 後のステップで git の認証を使わないため、資格情報をディスクに残さない https://docs.zizmor.sh/audits/#artipacked
          persist-credentials: false
      - uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5.1.0
        with:
          # sha256 を渡すと、署名付きの SHASUMS256.txt での mise 本体の照合を飛ばすため、version だけを渡す
          # https://github.com/jdx/mise-action/blob/v5.0.0/src/index.ts#L724-L745
          version: 2026.10.1
          # ローカルでは使わないので、mise.toml と mise.lock はルートではなく .github に置いている
          working_directory: .github
          install_args: hadolint
      # 検証用: find が一致するファイルを、git ls-files の指定と比べる
      - run: |
          find . -path ./.git -prune -o -type f \( -name Dockerfile -o -name 'Dockerfile.*' -o -name '*.Dockerfile' -o -name Containerfile -o -name 'Containerfile.*' \) -print | sed 's|^\./||' | sort > "$RUNNER_TEMP/find.txt"
          git ls-files ':(glob)**/Dockerfile' ':(glob)**/Dockerfile.*' ':(glob)**/*.Dockerfile' ':(glob)**/Containerfile' ':(glob)**/Containerfile.*' | sort > "$RUNNER_TEMP/git.txt"
          cat "$RUNNER_TEMP/find.txt"
          diff "$RUNNER_TEMP/git.txt" "$RUNNER_TEMP/find.txt"
        shell: bash
      # hadolint はファイルを渡さないと「Please provide a Dockerfile」で失敗するが、-exec の + の形は一致するファイルがなければ実行しない
      # https://github.com/hadolint/hadolint/blob/v2.15.1/app/Main.hs#L58-L59
      # hadolint の失敗が find の終了コードに伝わるのは + の形だけのため、; の形にしない https://man7.org/linux/man-pages/man1/find.1.html
      # デフォルトの failure-threshold は info で、style の指摘では失敗しないため、style を渡す
      # https://github.com/hadolint/hadolint/blob/v2.15.1/README.md#cli
      - run: >-
          find . -path ./.git -prune -o -type f
          \( -name Dockerfile -o -name 'Dockerfile.*' -o -name '*.Dockerfile'
          -o -name Containerfile -o -name 'Containerfile.*' \)
          -exec hadolint --failure-threshold style {} +
