name: hadolint

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  hadolint:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 後のステップで git の認証を使わないため、資格情報をディスクに残さない https://docs.zizmor.sh/audits/#artipacked
          persist-credentials: false
      - uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5.1.0
        with:
          # sha256 を渡すと、署名付きの SHASUMS256.txt での mise 本体の照合を飛ばすため、version だけを渡す
          # https://github.com/jdx/mise-action/blob/v5.0.0/src/index.ts#L724-L745
          version: 2026.10.1
          # ローカルでは使わないので、mise.toml と mise.lock はルートではなく .github に置いている
          working_directory: .github
          install_args: hadolint
      # :(glob) がないと、**/ がルートの Dockerfile に一致しない https://git-scm.com/docs/gitglossary#Documentation/gitglossary.txt-glob
      # hadolint はファイルを渡さないと「Please provide a Dockerfile」で失敗するため、1 つもなければ実行しない
      # https://github.com/hadolint/hadolint/blob/v2.15.1/app/Main.hs#L58-L59
      # デフォルトの failure-threshold は info で、style の指摘では失敗しないため、style を渡す
      # https://github.com/hadolint/hadolint/blob/v2.15.1/README.md#cli
      - run: >-
          git ls-files -z
          ':(glob)**/Dockerfile' ':(glob)**/Dockerfile.*' ':(glob)**/*.Dockerfile'
          ':(glob)**/Containerfile' ':(glob)**/Containerfile.*'
          | xargs -0 --no-run-if-empty hadolint --failure-threshold style
        # 未指定時の bash -e {0} は pipefail がなく、git ls-files が失敗して何も出力しないと、検査せずに成功するため
        # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#defaultsrunshell
        shell: bash
