name: test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  # dorny/paths-filter が PR の変更ファイルを API で取得するため https://github.com/dorny/paths-filter/blob/ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d/README.md?plain=1#L18-L23
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-26.04-arm
    steps:
      # 必須チェックなので、textlint.yml と同じく on.pull_request.paths で絞らずにステップを if で飛ばす
      - id: changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          # リポジトリにある設定の定義もテストで読む
          filters: |
            test:
              - '.github/scripts/**'
              - '.github/settings/**'
              # Renovate が ShellCheck の版だけを上げた PR でも検査する
              - 'mise.toml'
              - 'mise.lock'
              - '.github/workflows/test.yml'
              # ShellCheck と bats は .github/scripts の外にある .sh・.bats も対象にする
              - '**/*.sh'
              - '**/*.bats'
      - if: github.event_name == 'push' || steps.changes.outputs.test == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - if: github.event_name == 'push' || steps.changes.outputs.test == 'true'
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          # sha256 を渡すと、署名付きの SHASUMS256.txt での mise 本体の照合を飛ばすため、version だけを渡す
          # https://github.com/jdx/mise-action/blob/v5.0.0/src/index.ts#L724-L745
          version: 2026.9.17
          install_args: shellcheck
      - if: github.event_name == 'push' || steps.changes.outputs.test == 'true'
        run: git ls-files -z '*.sh' '*.bats' | xargs -0 shellcheck
        # 未指定時の bash -e {0} は pipefail がなく、git ls-files の失敗を見逃す https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#defaultsrunshell
        shell: bash
      - if: github.event_name == 'push' || steps.changes.outputs.test == 'true'
        uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43 # 4.0.0
        with:
          bats-version: 1.14.0
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false
          # bats の取得は GitHub API 経由で、未認証だとレート制限に当たりやすい https://github.com/bats-core/bats-action/blob/4.0.0/README.md#authenticated-requests
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name == 'push' || steps.changes.outputs.test == 'true'
        run: git ls-files -z '*.bats' | xargs -0 bats
        shell: bash
        env:
          # v1.14.0 は UTF-8 ロケールだと日本語のテスト名の一部を実行しない https://github.com/bats-core/bats-core/issues/1233
          LC_ALL: C
