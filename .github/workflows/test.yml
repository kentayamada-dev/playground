name: test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 後のステップで git の認証を使わないため、資格情報をディスクに残さない https://docs.zizmor.sh/audits/#artipacked
          persist-credentials: false
      - uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5.1.0
        with:
          # sha256 を渡すと、署名付きの SHASUMS256.txt での mise 本体の照合を飛ばすため、version だけを渡す
          # https://github.com/jdx/mise-action/blob/v5.0.0/src/index.ts#L724-L745
          version: 2026.10.2
          # ローカルでは使わないので、mise.toml と mise.lock はルートではなく .github に置いている
          working_directory: .github
          # bats のテストは gh をスタブに置き換えるが、スクリプトとスタブが使う jq は本物なので入れる
          install_args: shellcheck github:mvdan/sh bats jq
      - run: git ls-files -z '*.sh' '*.bats' | xargs -0 shellcheck
        # 未指定時の bash -e {0} は pipefail がなく、git ls-files の失敗を見逃す https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#defaultsrunshell
        shell: bash
      - run: git ls-files -z '*.sh' '*.bats' | xargs -0 shfmt --diff
        shell: bash
      - run: git ls-files -z '*.bats' | xargs -0 bats
        shell: bash
        env:
          # v1.14.0 は UTF-8 ロケールだと日本語のテスト名の一部を実行しない https://github.com/bats-core/bats-core/issues/1233
          LC_ALL: C
