name: test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  # dorny/paths-filter が PR の変更ファイルを API で取得するため
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-26.04-arm
    steps:
      # 必須チェックなので、textlint.yml と同じく on.pull_request.paths で絞らずにステップを if で飛ばす
      - id: changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          # リポジトリにある設定の定義もテストで読む
          filters: |
            test:
              - '.github/scripts/**'
              - '.github/settings/**'
              - '.github/workflows/test.yml'
      - if: github.event_name == 'push' || steps.changes.outputs.test == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # 新しい版で警告が増えて CI が突然落ちないよう、ランナーイメージの shellcheck を使わずに版を固定して入れる https://github.com/koalaman/shellcheck/blob/v0.11.0/README.md#in-your-build-or-test-suites
      - if: github.event_name == 'push' || steps.changes.outputs.test == 'true'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/shellcheck.tar.xz" "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/shellcheck-$SHELLCHECK_VERSION.linux.aarch64.tar.xz"
          sha256sum "$RUNNER_TEMP/shellcheck.tar.xz"
          echo "$SHELLCHECK_SHA256  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-$SHELLCHECK_VERSION" >> "$GITHUB_PATH"
        shell: bash
        env:
          # renovate.json5 の customManagers が、版と sha256 を一緒に更新する
          SHELLCHECK_VERSION: v0.10.0
          SHELLCHECK_SHA256: 12b331c1d2db6b9eb13cfca64306b1b157a86eb69db83023e261eaa7e7c14588
      - if: github.event_name == 'push' || steps.changes.outputs.test == 'true'
        run: git ls-files -z '*.sh' '*.bats' | xargs -0 shellcheck
        # 未指定時の bash -e {0} は pipefail がなく、git ls-files の失敗を見逃す https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#defaultsrunshell
        shell: bash
      - if: github.event_name == 'push' || steps.changes.outputs.test == 'true'
        uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43 # 4.0.0
        with:
          bats-version: 1.14.0
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false
          # bats の取得は GitHub API 経由で、未認証だとレート制限に当たりやすい https://github.com/bats-core/bats-action/blob/4.0.0/README.md#authenticated-requests
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name == 'push' || steps.changes.outputs.test == 'true'
        run: git ls-files -z '*.bats' | xargs -0 bats
        shell: bash
        env:
          # v1.14.0 は UTF-8 ロケールだと日本語のテスト名の一部を実行しない https://github.com/bats-core/bats-core/issues/1233
          LC_ALL: C
