name: test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  # dorny/paths-filter が PR の変更ファイルを API で取得するため https://github.com/dorny/paths-filter/blob/ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d/README.md?plain=1#L18-L23
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-26.04-arm
    steps:
      # 必須チェックなので、textlint.yml と同じく on.pull_request.paths で絞らずにステップを if で飛ばす
      - id: changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          # リポジトリにある設定の定義もテストで読む
          filters: |
            test:
              - '.github/scripts/**'
              - '.github/settings/**'
              # Renovate が ShellCheck・shfmt・bats・jq の版だけを上げた PR でも検査する
              - '.github/mise.toml'
              - '.github/mise.lock'
              - '.github/workflows/test.yml'
              # shfmt はインデントなどの整形の設定を .editorconfig から読むため、.editorconfig だけを変えた PR でも検査する
              # https://github.com/mvdan/sh/blob/v3.14.1/cmd/shfmt/shfmt.1.scd?plain=1#L19-L21
              - '.editorconfig'
              # ShellCheck・shfmt・bats は .github/scripts の外にある .sh・.bats も対象にする
              - '**/*.sh'
              - '**/*.bats'
      - if: github.event_name == 'push' || steps.changes.outputs.test == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # 後のステップで git の認証を使わないため、資格情報をディスクに残さない https://docs.zizmor.sh/audits/#artipacked
          persist-credentials: false
      - if: github.event_name == 'push' || steps.changes.outputs.test == 'true'
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          # sha256 を渡すと、署名付きの SHASUMS256.txt での mise 本体の照合を飛ばすため、version だけを渡す
          # https://github.com/jdx/mise-action/blob/v5.0.0/src/index.ts#L724-L745
          version: 2026.9.18
          # ローカルでは使わないので、mise.toml と mise.lock はルートではなく .github に置いている
          working_directory: .github
          # bats のテストは gh をスタブに置き換えるが、スクリプトとスタブが使う jq は本物なので入れる
          install_args: shellcheck github:mvdan/sh bats jq
      - if: github.event_name == 'push' || steps.changes.outputs.test == 'true'
        run: git ls-files -z '*.sh' '*.bats' | xargs -0 shellcheck
        # 未指定時の bash -e {0} は pipefail がなく、git ls-files の失敗を見逃す https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#defaultsrunshell
        shell: bash
      - if: github.event_name == 'push' || steps.changes.outputs.test == 'true'
        run: git ls-files -z '*.sh' '*.bats' | xargs -0 shfmt --diff
        shell: bash
      - if: github.event_name == 'push' || steps.changes.outputs.test == 'true'
        run: git ls-files -z '*.bats' | xargs -0 bats
        shell: bash
        env:
          # v1.14.0 は UTF-8 ロケールだと日本語のテスト名の一部を実行しない https://github.com/bats-core/bats-core/issues/1233
          LC_ALL: C
