name: test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 後のステップで git の認証を使わないため、資格情報をディスクに残さない https://docs.zizmor.sh/audits/#artipacked
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          # sha256 を渡すと、署名付きの SHASUMS256.txt での mise 本体の照合を飛ばすため、version だけを渡す
          # https://github.com/jdx/mise-action/blob/v5.0.0/src/index.ts#L724-L745
          version: 2026.10.3
          # ローカルでは使わないので、mise.toml と mise.lock はルートではなく .github に置いている
          working_directory: .github
          # bats のテストは gh をスタブに置き換えるが、スクリプトとスタブが使う jq は本物なので入れる
          install_args: shellcheck github:mvdan/sh bats jq
      # shellcheck は渡したファイルしか検査せず、shfmt はディレクトリを渡すと拡張子のない shebang のファイルまで対象にするため、find で同じファイルを渡す
      # https://github.com/koalaman/shellcheck/blob/v0.11.0/shellcheck.1.md https://github.com/mvdan/sh/blob/v3.14.1/fileutil/file.go#L67-L84
      # 検査の失敗が find の終了コードに伝わるのは -exec の + の形だけのため、; の形にしない https://github.com/kentayamada-dev/playground/pull/235
      - run: |
          find . -path ./.git -prune -o -type f \( -name '*.sh' -o -name '*.bats' \) -exec shellcheck --enable=all -f json1 {} + >"$RUNNER_TEMP/sc.json" || true
          echo "=== total before shfmt"
          jq -s '[.[].comments[]] | length' "$RUNNER_TEMP/sc.json"
          jq -r '.comments[] | "\(.file):\(.line):\(.column): SC\(.code) \(.level): \(.message)"' "$RUNNER_TEMP/sc.json"
      - run: |
          find . -path ./.git -prune -o -type f \( -name '*.sh' -o -name '*.bats' \) -exec shfmt -w {} +
          mkdir -p "$RUNNER_TEMP/out"
          git diff >"$RUNNER_TEMP/out/shfmt.diff"
          git diff --stat
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shfmt-diff
          path: ${{ runner.temp }}/out/shfmt.diff
      - run: |
          find . -path ./.git -prune -o -type f \( -name '*.sh' -o -name '*.bats' \) -exec shellcheck --enable=all -f json1 {} + >"$RUNNER_TEMP/sc2.json" || true
          echo "=== total after shfmt"
          jq -s '[.[].comments[]] | length' "$RUNNER_TEMP/sc2.json"
          jq -r '.comments[] | "\(.file):\(.line):\(.column): SC\(.code) \(.level): \(.message)"' "$RUNNER_TEMP/sc2.json"
      # -r は . で始まるディレクトリも含めて、サブディレクトリの .bats を集める https://github.com/bats-core/bats-core/blob/v1.14.0/libexec/bats-core/bats#L501-L504
      - run: bats -r .
        env:
          # v1.14.0 は UTF-8 ロケールだと日本語のテスト名の一部を実行しない https://github.com/bats-core/bats-core/issues/1233
          LC_ALL: C
