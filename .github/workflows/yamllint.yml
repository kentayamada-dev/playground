name: yamllint

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  yamllint:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 後のステップで git の認証を使わないため、資格情報をディスクに残さない https://docs.zizmor.sh/audits/#artipacked
          persist-credentials: false
      - uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5.1.0
        with:
          # sha256 を渡すと、署名付きの SHASUMS256.txt での mise 本体の照合を飛ばすため、version だけを渡す
          # https://github.com/jdx/mise-action/blob/v5.0.0/src/index.ts#L724-L745
          version: 2026.10.1
          # ローカルでは使わないので、mise.toml と mise.lock はルートではなく .github に置いている
          working_directory: .github
          install_args: uv
      - run: uv sync --locked
        working-directory: .github/yamllint
      # ディレクトリを渡すと、uv sync が作る .venv など git で管理していないファイルまで読むため、ファイルを列挙して渡す
      # https://github.com/adrienverge/yamllint/blob/v1.38.0/yamllint/cli.py
      - run: >-
          git ls-files -z '*.yml' '*.yaml'
          | xargs -0 .github/yamllint/.venv/bin/yamllint --strict --format github --config-file .github/yamllint/.yamllint.yaml
        # 未指定時の bash -e {0} は pipefail がなく、git ls-files が途中で失敗すると、出力済みのファイルだけを検査して成功するため
        # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#defaultsrunshell
        shell: bash
