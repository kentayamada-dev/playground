name: yamllint

on:
  pull_request:
  push:
    branches:
      - main
      - test/yamllint-dir-pass

permissions:
  contents: read

jobs:
  yamllint:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 後のステップで git の認証を使わないため、資格情報をディスクに残さない https://docs.zizmor.sh/audits/#artipacked
          persist-credentials: false
      - uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5.1.0
        with:
          # sha256 を渡すと、署名付きの SHASUMS256.txt での mise 本体の照合を飛ばすため、version だけを渡す
          # https://github.com/jdx/mise-action/blob/v5.0.0/src/index.ts#L724-L745
          version: 2026.10.1
          # ローカルでは使わないので、mise.toml と mise.lock はルートではなく .github に置いている
          working_directory: .github
          install_args: uv
      - run: uv sync --locked
        working-directory: .github/yamllint
      # .venv など、git で管理していないファイルを除く設定は .github/yamllint/.yamllint.yaml にある
      - run: >-
          .github/yamllint/.venv/bin/yamllint --strict --format github --config-file .github/yamllint/.yamllint.yaml .
      # 検証用: yamllint が読むファイルを git ls-files と比べ、.venv を除かない設定でも数える
      - run: |
          .github/yamllint/.venv/bin/yamllint --list-files --config-file .github/yamllint/.yamllint.yaml . | sed 's|^\./||' | sort > "$RUNNER_TEMP/yamllint.txt"
          git ls-files '*.yml' '*.yaml' | grep -Ev '(^|/)pnpm-lock\.yaml$' | sort > "$RUNNER_TEMP/git.txt"
          wc -l "$RUNNER_TEMP/yamllint.txt" "$RUNNER_TEMP/git.txt"
          grep -E '^\.' "$RUNNER_TEMP/yamllint.txt"
          diff "$RUNNER_TEMP/git.txt" "$RUNNER_TEMP/yamllint.txt"
          grep -v '^  - \.venv/$' .github/yamllint/.yamllint.yaml > "$RUNNER_TEMP/no-venv.yaml"
          .github/yamllint/.venv/bin/yamllint --list-files --config-file "$RUNNER_TEMP/no-venv.yaml" . > "$RUNNER_TEMP/no-venv.txt"
          echo "--- .venv/ を除かないときに読む .venv の下のファイル: $(grep -c '/\.venv/' "$RUNNER_TEMP/no-venv.txt")"
          grep -m 5 '/\.venv/' "$RUNNER_TEMP/no-venv.txt"
        shell: bash
