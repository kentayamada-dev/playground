name: json

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  json:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # 後のステップで git の認証を使わないため、資格情報をディスクに残さない https://docs.zizmor.sh/audits/#artipacked
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          # sha256 を渡すと、署名付きの SHASUMS256.txt での mise 本体の照合を飛ばすため、version だけを渡す
          # https://github.com/jdx/mise-action/blob/v5.0.0/src/index.ts#L724-L745
          version: 2026.10.0
          # ローカルでは使わないので、mise.toml と mise.lock はルートではなく .github に置いている
          working_directory: .github
          install_args: jq
      # Claude Code は JSON として読めない設定ファイルを丸ごと飛ばすため、マージ前に検出する https://code.claude.com/docs/en/settings#fix-a-broken-settings-file
      # jq は空のファイルや値が複数並ぶファイルも読めるため、値がちょうど 1 つか（https://www.rfc-editor.org/rfc/rfc8259#section-2）を確かめ、失敗したファイルの名前を示す
      - run: |
          status=0
          while IFS= read -r -d '' file; do
            if ! jq -s -e 'length == 1' "$file" >/dev/null; then
              echo "::error file=$file::JSON として読めないか、値がちょうど 1 つではありません"
              status=1
            fi
          done < <(git ls-files -z '*.json')
          exit "$status"
