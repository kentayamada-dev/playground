name: textlint

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  textlint:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: .github/textlint/package.json
          cache: true
          cache_dependency_path: .github/textlint/pnpm-lock.yaml
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
        working-directory: .github/textlint
      - run: .github/textlint/lint.sh
