name: textlint

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  # dorny/paths-filter が PR の変更ファイルを API で取得するため
  pull-requests: read

jobs:
  textlint:
    runs-on: ubuntu-26.04-arm
    steps:
      # on.pull_request.paths で絞ると、実行されなかった PR で必須チェックが Pending のまま残りマージできないため、ステップを if で飛ばす
      # https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/collaborating-on-repositories-with-code-quality-features/troubleshooting-required-status-checks
      - id: changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          # リポジトリ全体の .md を検査するので、ルール・依存・ワークフローの変更でも既存の文書の結果が変わる
          filters: |
            textlint:
              - '**/*.md'
              - '.github/textlint/**'
              - '.github/workflows/textlint.yml'
      - if: github.event_name == 'push' || steps.changes.outputs.textlint == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - if: github.event_name == 'push' || steps.changes.outputs.textlint == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          # pnpm のバージョンは package.json の packageManager だけで管理する。Renovate もロックファイルの更新にこのバージョンを使う
          package_json_file: .github/textlint/package.json
          cache: true
          cache_dependency_path: .github/textlint/pnpm-lock.yaml
      - if: github.event_name == 'push' || steps.changes.outputs.textlint == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - if: github.event_name == 'push' || steps.changes.outputs.textlint == 'true'
        run: pnpm install --frozen-lockfile
        working-directory: .github/textlint
      # 相対パスだとルールの解決に失敗するため絶対パスで渡す（textlint は path.join した値をそのまま require.resolve する）
      - if: github.event_name == 'push' || steps.changes.outputs.textlint == 'true'
        run: >-
          .github/textlint/node_modules/.bin/textlint
          --config "$GITHUB_WORKSPACE/.github/textlint/.textlintrc.json"
          --rules-base-directory "$GITHUB_WORKSPACE/.github/textlint/node_modules"
          "**/*.md"
