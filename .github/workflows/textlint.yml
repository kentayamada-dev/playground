name: textlint

on:
  pull_request:

permissions:
  contents: read
  # reviewdog が PR の差分を取得するため
  pull-requests: read

jobs:
  textlint:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: .github/textlint/package.json
          cache: true
          cache_dependency_path: .github/textlint/pnpm-lock.yaml
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
        working-directory: .github/textlint
      - uses: reviewdog/action-setup@v1
      - env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ github.token }}
        run: .github/textlint/lint.sh

  test:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - run: .github/textlint/test/bats/bin/bats .github/textlint/test
