name: textlint

on:
  pull_request:

permissions:
  contents: read
  # reviewdog が PR の差分を取得するため
  pull-requests: read

jobs:
  textlint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: .github/textlint/package.json
          cache: true
          cache_dependency_path: .github/textlint/pnpm-lock.yaml
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
        working-directory: .github/textlint
      - uses: reviewdog/action-setup@v1
      - env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          status=0
          # 相対パスだとルールの解決に失敗するため絶対パスで渡す（textlint は path.join した値をそのまま require.resolve する）
          .github/textlint/node_modules/.bin/textlint \
            --rules-base-directory "$GITHUB_WORKSPACE/.github/textlint/node_modules" \
            -f checkstyle "**/*.md" > "$RUNNER_TEMP/textlint.xml" || status=$?
          # 2 はルールの読み込み失敗などの異常終了。指摘 0 件として通さないよう、ここで失敗させる
          if [ "$status" -ge 2 ]; then
            exit "$status"
          fi
          reviewdog -f=checkstyle -name=textlint -reporter=github-pr-annotations \
            -filter-mode=added -fail-level=error < "$RUNNER_TEMP/textlint.xml"
