name: textlint

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# 同じ PR に push し直したら古い実行を取り消す。PR 以外は実行ごとにグループを分け、待っている実行も後から来た実行に取り消されないようにする
# https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  textlint:
    name: textlint
    runs-on: ubuntu-26.04-arm
    # npm.flatt.tech に接続できないと pnpm install が止まり続け、デフォルトの 360 分までジョブが続くため https://github.com/kentayamada-dev/playground/pull/45
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 後のステップで git の認証を使わないため、資格情報をディスクに残さない https://docs.zizmor.sh/audits/#artipacked
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        # action は pnpm 本体を ~/setup-pnpm での npm ci と pnpm self-update で取得し pnpm-workspace.yaml を読まないため、取得元を環境変数で渡す（pnpm は v11 から npm_config_* を読まない）
        # https://github.com/pnpm/action-setup/blob/0977fd99725f1db4007ccb2928dbb4e90d06cc86/src/install-pnpm/run.ts https://pnpm.io/blog/releases/11.0
        env:
          npm_config_registry: https://npm.flatt.tech/
          pnpm_config_registry: https://npm.flatt.tech/
        with:
          # pnpm のバージョンは package.json の devEngines.packageManager だけで管理する。Renovate もロックファイルの更新にこのバージョンを使う
          # https://github.com/renovatebot/renovate/blob/44.151.1/lib/modules/manager/npm/post-update/pnpm.ts#L55-L65 https://github.com/renovatebot/renovate/blob/44.151.1/lib/modules/manager/npm/post-update/utils.ts#L18-L30
          package_json_file: .github/textlint/package.json
          cache: true
          cache_dependency_path: .github/textlint/pnpm-lock.yaml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
        working-directory: .github/textlint
      # 相対パスだとルールの解決に失敗するため絶対パスで渡す（textlint は path.join した値をそのまま require.resolve する）
      # https://github.com/textlint/textlint/blob/v15.8.0/packages/@textlint/config-loader/src/textlint-module-resolver.ts#L66-L78 https://github.com/textlint/textlint/blob/v15.8.0/packages/@textlint/resolver/src/index.ts#L51-L66
      - run: >-
          .github/textlint/node_modules/.bin/textlint
          --config "$GITHUB_WORKSPACE/.github/textlint/.textlintrc.json"
          --rules-base-directory "$GITHUB_WORKSPACE/.github/textlint/node_modules"
          "**/*.md"
