name: renovate-config-validator

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  renovate-config-validator:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    # renovate.yml で動かす Renovate と同じイメージで検査し、設定の解釈を本番の実行とそろえる。
    # docker:// のアクションは Actions の許可設定で起動できないため、ジョブのコンテナで動かす https://github.com/kentayamada-dev/playground/actions/runs/38712548741
    container:
      image: renovate/renovate:44.151.1@sha256:f19b0925b1d6f0750da6f521c1c7886ad058b03341f9e757f6f7e3f96b7864c8
      # イメージの既定のユーザー（12021）は、ランナーの作業ディレクトリに書き込めず actions/checkout が失敗するため https://github.com/kentayamada-dev/playground/actions/runs/38713097842
      options: --user root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # 後のステップで git の認証を使わないため、資格情報をディスクに残さない https://docs.zizmor.sh/audits/#artipacked
          persist-credentials: false
      # ファイルを渡すとセルフホストの全体設定として検査されるため、--no-global でリポジトリの設定として検査する
      # https://github.com/renovatebot/renovate/blob/44.151.1/lib/config-validator.ts#L142
      - run: renovate-config-validator --no-global .github/renovate.json5
