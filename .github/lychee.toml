include_fragments = "anchor-only"
no_progress = true
require_https = true

# web と api のサーバーがコンテナのなかで待ち受けるアドレスで、CI からは接続できないため
# このファイルも検査の対象で、localhost の行からは http://localhost/ が拾われるため、ポートの有無によらず一致させる
exclude = [
  '^http://localhost\b',
  '^http://api:8080\b',
]

# 渡したグロブの * と ** は、デフォルトでは . で始まるファイルとディレクトリに一致せず、.github などを見落とすため
# https://github.com/lycheeverse/lychee/blob/lychee-v0.24.2/lychee-lib/src/types/input/resolver.rs#L121-L123
hidden = true

exclude_path = [
  # hidden を有効にすると、グロブが .git のなかにも一致するため
  '^\.git/',
  # mise.lock と uv.lock の URL は mise lock と uv lock が書くもので、手で直さないため
  '^\.github/mise\.lock$',
  '^\.github/yamllint/uv\.lock$',
]
