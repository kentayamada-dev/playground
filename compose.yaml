# USER_NAME を変えるときは、両方の devcontainer.json の remoteUser も合わせる
x-build-args: &build-args
  USER_NAME: dev
  HISTORY_DIR: &history-dir /commandhistory

services:
  node:
    build:
      context: .devcontainer/node
      args:
        <<: *build-args
        NODE_MODULES_DIR: &node-modules-dir /workspace/node/node_modules
    # 既定のホスト名はコンテナ ID で、端末のプロンプトからどちらのコンテナかわからないため
    hostname: node
    # docker compose run を、--workdir を付けなくてもプロジェクトのディレクトリで動かすため
    working_dir: /workspace/node
    volumes:
      # コンテナのなかでも git を使えるよう、.git のあるリポジトリのルートをマウントする
      # https://code.visualstudio.com/remote/advancedcontainers/connect-multiple-containers
      - .:/workspace
      # macOS のバインドマウントは、インストールのように書き込みの多い処理が遅いため
      # https://code.visualstudio.com/remote/advancedcontainers/improve-performance
      - type: volume
        source: node-node-modules
        target: *node-modules-dir
      # コンテナを作り直しても bash の履歴を残すため
      # https://code.visualstudio.com/remote/advancedcontainers/persist-bash-history
      - type: volume
        source: node-history
        target: *history-dir
    # Compose では overrideCommand が既定で false で、イメージの CMD（node のイメージは node、golang のイメージは bash）は端末がないとすぐ終了するため
    # https://containers.dev/implementors/json_reference/
    command: sleep infinity
    environment:
      GOLANG_URL: http://golang:8080
      NEXT_TELEMETRY_DISABLED: 1

  golang:
    build:
      context: .devcontainer/golang
      args:
        <<: *build-args
        GO_CACHE_DIR: &go-cache-dir /gocache
    hostname: golang
    working_dir: /workspace/golang
    volumes:
      - .:/workspace
      # コンテナを作り直しても、ダウンロードしたモジュールとビルドの結果を使い回すため
      - type: volume
        source: golang-go-cache
        target: *go-cache-dir
      - type: volume
        source: golang-history
        target: *history-dir
    command: sleep infinity

  postgres:
    # メジャーを上げると、前の版のデータが残るボリュームでは起動に失敗する。上げるときは、pg_upgrade でデータを移すか、ボリュームを消す
    # https://github.com/docker-library/postgres/blob/e00e1bd34ec5c8a8e7ad89b273b3d42efaf6d5bc/18/trixie/docker-entrypoint.sh#L140-L167 https://github.com/docker-library/postgres/blob/e00e1bd34ec5c8a8e7ad89b273b3d42efaf6d5bc/18/trixie/docker-entrypoint.sh#L244-L263
    image: postgres:18.6-trixie@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
    environment:
      # ポートをホストに公開しない開発用のデータベースのため、パスワードは固定の値にする
      POSTGRES_PASSWORD: postgres # betterleaks:allow
    volumes:
      # 17 以前のイメージと同じ /var/lib/postgresql/data にマウントすると、18 以降のイメージは起動に失敗する
      # https://github.com/docker-library/postgres/blob/e00e1bd34ec5c8a8e7ad89b273b3d42efaf6d5bc/18/trixie/Dockerfile#L189-L192 https://github.com/docker-library/postgres/blob/e00e1bd34ec5c8a8e7ad89b273b3d42efaf6d5bc/18/trixie/docker-entrypoint.sh#L255-L262
      - type: volume
        source: postgres-data
        target: /var/lib/postgresql
    healthcheck:
      # 初期化中の一時的なサーバーはソケットでしか待ち受けないため、TCP で確かめて初期化の完了を待つ
      # https://github.com/docker-library/postgres/blob/e00e1bd34ec5c8a8e7ad89b273b3d42efaf6d5bc/18/trixie/docker-entrypoint.sh#L288-L297
      test: [CMD, pg_isready, --host=localhost, --username=postgres]
      # 既定では起動の 30 秒後に初めて確かめ、docker compose up --wait がそれまで待たされるため、起動中は 1 秒ごとに確かめる
      # https://docs.docker.com/reference/dockerfile/#healthcheck
      start_period: 30s
      start_interval: 1s

volumes:
  node-node-modules:
  node-history:
  golang-go-cache:
  golang-history:
  postgres-data:
